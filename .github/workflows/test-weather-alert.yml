name: Test Weather Alert Email

on:
  workflow_dispatch:

jobs:
  test-weather-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Get our files
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install project
        run: npm install

      - name: Send fake weather alert
        run: node test-weather-alert.js
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
