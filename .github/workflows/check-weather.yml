name: Test Earth Networks Widget

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Get our files
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install project
        run: npm install

      - name: Install Chrome browser
        run: npx playwright install --with-deps chromium

      - name: Check Earth Networks widget
        run: node check-widget.js

      - name: Save new alert status
        run: |
          if [ -f status-changed.txt ] && [ "$(cat status-changed.txt)" = "YES" ]; then
            echo "Alert status changed. Saving new status."

            git config user.name "Broadneck Weather Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add last-status.txt
            git commit -m "Update Earth Networks alert status"
            git push
          else
            echo "No alert status change. Nothing to save."
          fi

      - name: Save widget screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earth-networks-widget
          path: widget-screenshot.png
          if-no-files-found: ignore
