name: Test Earth Networks Widget

on:
  workflow_dispatch:

jobs:
  check-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Get our files
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install project
        run: npm install

      - name: Install Chrome browser
        run: npx playwright install --with-deps chromium

      - name: Check Earth Networks widget
        run: node check-widget.js

      - name: Save widget screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earth-networks-widget
          path: widget-screenshot.png
          if-no-files-found: ignore
